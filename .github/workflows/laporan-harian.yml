name: Laporan harian AI

# Menulis laporan harian (ringkasan, pembelajaran, kendala) secara otomatis
# setiap kegiatan disimpan, plus pengecekan sore sebelum absen monev.
# Butuh secret GEMINI_API_KEY dan/atau GROQ_API_KEY (Settings → Secrets → Actions).
on:
  push:
    paths: ['data/kegiatan.json']
  schedule:
    - cron: '40 8 * * *'   # 15.40 WIB
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: laporan-harian-ai
  cancel-in-progress: false

jobs:
  tulis:
    # Hanya branch utama repo (main/master/...), berlaku juga untuk repo salinan.
    # (Jadwal selalu berjalan di branch utama; payload-nya tanpa data repository.)
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
    steps:
      - name: Beri waktu panel admin menulis laporannya sendiri
        if: github.event_name == 'push'
        run: sleep 75

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BRANCH }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Tulis laporan harian yang belum ada/berubah
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NOTIF_FILE: ${{ runner.temp }}/notifikasi-ai.json
        run: node scripts/laporan-harian.mjs

      - name: Simpan ke repositori
        run: |
          if git diff --quiet -- data; then echo "Tidak ada perubahan."; exit 0; fi
          git config user.name "laporan-magang-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/harian.json data/ringkasan.json
          git commit -m "Laporan harian AI (otomatis)"
          for i in 1 2 3; do
            git push origin "HEAD:$BRANCH" && exit 0
            git pull --rebase origin "$BRANCH" || { git rebase --abort; rm -f "$RUNNER_TEMP/notifikasi-ai.json"; echo "Bentrok dengan perubahan baru; dicoba lagi pada jadwal berikutnya."; exit 0; }
          done
          exit 1

      - name: Notifikasi laporan AI siap
        if: success() && hashFiles('data/notifikasi.json') != ''
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          f="$RUNNER_TEMP/notifikasi-ai.json"
          if [ -f "$f" ]; then node scripts/notifikasi.mjs --berkas "$f" --tanpa-bersih; fi

      - name: Notifikasi laporan AI gagal
        if: failure() && hashFiles('data/notifikasi.json') != ''
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: >
          node scripts/notifikasi.mjs --tanpa-bersih --kategori ai
          --judul "⚠️ Laporan harian AI gagal dibuat"
          --isi "Robot tidak berhasil menulis laporan. Buka panel admin lalu tekan Tulis ulang dengan AI, atau lihat tab Actions di GitHub."
          --url "admin.html?aksi=harian"
