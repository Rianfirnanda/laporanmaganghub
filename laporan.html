<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <script src="assets/theme.js?v=18"></script>
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Laporan Mingguan Magang</title>
  <link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d4ed8'/%3E%3Cpath d='M22 16h14l8 8v24H22z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M28 34h10M28 41h10' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Naikkan ?v= setiap kali CSS/JS diubah agar browser tidak memakai cache lama. -->
  <link rel="stylesheet" href="assets/laporan.css?v=18">
</head>
<body>
  <header class="toolbar">
    <a class="tb-back" href="./#rekap"><svg class="ic" aria-hidden="true"><use href="#i-arrowLeft"/></svg> Kembali</a>
    <label class="tb-week"><span>Minggu</span><select id="week"></select></label>
    <div class="tb-modes" role="tablist">
      <button type="button" class="tb-mode" data-mode="dokumen"><svg class="ic" aria-hidden="true"><use href="#i-file"/></svg> Laporan</button>
      <button type="button" class="tb-mode" data-mode="slide"><svg class="ic" aria-hidden="true"><use href="#i-image"/></svg> Slide</button>
    </div>
    <button class="theme-btn" type="button" data-theme-toggle aria-label="Ganti mode tampilan"><svg class="ic i-moon" aria-hidden="true"><use href="#i-moon"/></svg><svg class="ic i-sun" aria-hidden="true"><use href="#i-sun"/></svg></button>
    <button type="button" class="tb-print" id="btnPrint"><svg class="ic" aria-hidden="true"><use href="#i-printer"/></svg> <span id="printLabel">Cetak / Simpan PDF</span></button>
  </header>
  <p class="tb-hint" id="hint"></p>

  <main id="out"><p class="loading">Menyiapkan laporan…</p></main>

  <script src="assets/common.js?v=18"></script>
  <script src="assets/laporan.js?v=18"></script>
</body>
</html>
