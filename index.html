<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Laporan Kegiatan Magang</title>
  <meta name="description" content="Dokumentasi kegiatan harian magang di BPS Kabupaten Bengkulu Tengah.">
  <meta name="theme-color" content="#163ba2">
  <link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d4ed8'/%3E%3Cpath d='M22 16h14l8 8v24H22z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M28 34h10M28 41h10' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Naikkan ?v= setiap kali CSS/JS diubah agar browser tidak memakai cache lama. -->
  <link rel="stylesheet" href="assets/style.css?v=6">
</head>
<body>
  <nav class="navbar" id="top">
    <div class="container nav-inner">
      <a class="brand" href="./">
        <span class="brand-mark"><svg class="ic" aria-hidden="true"><use href="#i-file"/></svg></span>
        <span class="brand-text">Laporan<b>magang</b></span>
      </a>
      <div class="nav-menu" id="navMenu">
        <a href="#harian" data-view="harian">Kegiatan</a>
        <a href="#galeri" data-view="galeri">Galeri</a>
        <a href="#rekap" data-view="rekap">Rekap Mingguan</a>
        <a href="#tentang">Tentang</a>
        <button class="btn btn-outline nav-print" type="button" data-print>
          <svg class="ic" aria-hidden="true"><use href="#i-printer"/></svg> Cetak Laporan
        </button>
      </div>
      <div class="nav-right">
        <button class="btn btn-outline btn-print-desktop" type="button" data-print>
          Cetak Laporan <svg class="ic" aria-hidden="true"><use href="#i-chevron"/></svg>
        </button>
        <span class="nav-avatar" id="navAvatar"></span>
        <button class="nav-toggle" id="navToggle" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="navMenu">
          <svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <header class="hero">
    <div class="container hero-inner">
      <div class="profile">
        <div class="avatar" id="avatar"></div>
        <div class="profile-text">
          <h1 id="nama">Memuat…</h1>
          <div class="chips">
            <span class="badge-pill" id="posisi"></span>
            <span class="hero-sub" id="instansi"></span>
          </div>
        </div>
      </div>
      <div class="progress" id="progress" hidden>
        <div class="progress-text">
          <span class="progress-label" id="progressLabel"></span>
          <span class="progress-sub" id="progressSub"></span>
        </div>
        <svg class="ring" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="27" class="ring-bg"/>
          <circle cx="32" cy="32" r="27" class="ring-fg" id="ringFg"/>
          <text x="32" y="36" text-anchor="middle" id="ringText">0%</text>
        </svg>
      </div>
    </div>
  </header>

  <div class="tabbar">
    <div class="container tabbar-inner" role="tablist">
      <button class="tabbar-item active" type="button" role="tab" data-view="harian">
        <svg class="ic" aria-hidden="true"><use href="#i-grid"/></svg> <span class="lbl-long">Kegiatan Harian</span><span class="lbl-short">Harian</span>
      </button>
      <button class="tabbar-item" type="button" role="tab" data-view="galeri">
        <svg class="ic" aria-hidden="true"><use href="#i-image"/></svg> <span class="lbl-long">Galeri Foto</span><span class="lbl-short">Galeri</span>
      </button>
      <button class="tabbar-item" type="button" role="tab" data-view="rekap">
        <svg class="ic" aria-hidden="true"><use href="#i-history"/></svg> <span class="lbl-long">Rekap Mingguan</span><span class="lbl-short">Rekap</span>
      </button>
    </div>
  </div>

  <main class="container page">
    <div class="banner">
      <span class="banner-icon"><svg class="ic" aria-hidden="true"><use href="#i-calendar"/></svg></span>
      <div>
        <strong id="bannerTitle">Dokumentasi Kegiatan Magang</strong>
        <span id="bannerText"></span>
      </div>
    </div>

    <div class="layout">
      <div class="main-col">
        <section class="card filters">
          <label class="field">
            <span>Minggu</span>
            <select id="filterMinggu"><option value="">Semua minggu</option></select>
          </label>
          <label class="field">
            <span>Tanggal</span>
            <select id="filterTanggal"><option value="">Semua tanggal</option></select>
          </label>
          <label class="field grow">
            <span>Cari kegiatan</span>
            <input type="search" id="filterCari" placeholder="Ketik kata kunci…">
          </label>
          <button class="btn btn-light" id="btnReset" type="button">Reset</button>
        </section>

        <section id="view-harian" class="view" aria-live="polite"><p class="empty">Memuat kegiatan…</p></section>
        <section id="view-galeri" class="view" hidden></section>
        <section id="view-rekap" class="view" hidden></section>
      </div>

      <aside class="side-col">
        <section class="card">
          <div class="card-header"><h3>Info Instansi &amp; Mentor</h3></div>
          <div class="card-body side-body">
            <div class="org">
              <span class="org-logo" id="orgLogo"></span>
              <div>
                <strong id="orgName"></strong>
                <span id="orgRole"></span>
              </div>
            </div>
            <p class="org-program" id="orgProgram" hidden></p>
            <div id="mentorBox" hidden>
              <div class="side-label">Mentor Pembimbing</div>
              <div class="org">
                <span class="org-logo soft" id="mentorLogo"></span>
                <div>
                  <strong id="mentorName"></strong>
                  <span id="mentorRole"></span>
                </div>
              </div>
            </div>
            <div class="side-label">Periode Magang</div>
            <dl class="kv" id="periode"></dl>
          </div>
        </section>

        <section class="card">
          <div class="card-header"><h3>Ringkasan</h3></div>
          <div class="card-body">
            <div class="mini-stats" id="stats"></div>
            <p class="updated" id="updated"></p>
          </div>
        </section>
      </aside>
    </div>
  </main>

  <footer class="site-footer" id="tentang">
    <div class="container">
      <div class="footer-grid" id="footerGrid"></div>
      <div class="footer-bottom">
        <span id="footerText"></span>
        <span class="footer-links">
          <a id="portoLink" target="_blank" rel="noopener" hidden></a>
          <a href="admin.html" id="adminLink" hidden>Panel admin</a>
        </span>
      </div>
    </div>
  </footer>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" id="lbClose" type="button" aria-label="Tutup"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="Sebelumnya">‹</button>
    <figure>
      <img id="lbImg" alt="">
      <figcaption id="lbCap"></figcaption>
    </figure>
    <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="Berikutnya">›</button>
  </div>

  <script src="assets/common.js?v=6"></script>
  <script src="assets/app.js?v=6"></script>
</body>
</html>
